<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect x="0" y="0" width="100%" height="100%" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2}.line{stroke:#000;stroke-width:2;fill:none}.dash{stroke:#000;stroke-width:2;fill:none;stroke-dasharray:8 6}.title{font-size:28px;font-weight:bold}.head{font-size:18px;font-weight:bold}.t{font-size:14px}.st{font-size:13px}
</style>
<text x="800" y="45" text-anchor="middle" class="title">TRANS-UB Detailed Class / Interface Design — UC-05</text>

<!-- Controller -->
<rect x="80" y="120" width="300" height="150" class="box"/><line x1="80" y1="165" x2="380" y2="165" class="line"/>
<text x="230" y="150" text-anchor="middle" class="head">ReservationController</text>
<text x="100" y="205" class="t">+ reserve(listingId, buyerId, note)</text>

<!-- Service -->
<rect x="500" y="90" width="360" height="230" class="box"/><line x1="500" y1="135" x2="860" y2="135" class="line"/>
<text x="680" y="120" text-anchor="middle" class="head">ReservationService</text>
<text x="520" y="175" class="t">- listingRepository</text><text x="520" y="205" class="t">- orderRepository</text>
<text x="520" y="235" class="t">- historyRepository</text><text x="520" y="265" class="t">- notificationPort</text>
<text x="520" y="300" class="t">+ reserve(...) : ReservationResult</text>

<!-- Interfaces top/right -->
<rect x="1010" y="80" width="300" height="165" class="box"/><line x1="1010" y1="135" x2="1310" y2="135" class="line"/>
<text x="1160" y="108" text-anchor="middle" class="st">&lt;&lt;interface&gt;&gt;</text><text x="1160" y="128" text-anchor="middle" class="head">ListingRepository</text>
<text x="1030" y="175" class="t">+ findById()</text><text x="1030" y="205" class="t">+ reserveIfAvailable()</text>

<rect x="1010" y="285" width="300" height="165" class="box"/><line x1="1010" y1="340" x2="1310" y2="340" class="line"/>
<text x="1160" y="313" text-anchor="middle" class="st">&lt;&lt;interface&gt;&gt;</text><text x="1160" y="333" text-anchor="middle" class="head">OrderRepository</text>
<text x="1030" y="380" class="t">+ save()</text><text x="1030" y="410" class="t">+ existsLiveForListing()</text>

<rect x="1010" y="490" width="300" height="145" class="box"/><line x1="1010" y1="545" x2="1310" y2="545" class="line"/>
<text x="1160" y="518" text-anchor="middle" class="st">&lt;&lt;interface&gt;&gt;</text><text x="1160" y="538" text-anchor="middle" class="head">OrderStatusChangeRepository</text>
<text x="1030" y="585" class="t">+ save(change)</text>

<rect x="1010" y="675" width="300" height="145" class="box"/><line x1="1010" y1="730" x2="1310" y2="730" class="line"/>
<text x="1160" y="703" text-anchor="middle" class="st">&lt;&lt;interface&gt;&gt;</text><text x="1160" y="723" text-anchor="middle" class="head">NotificationPort</text>
<text x="1030" y="770" class="t">+ notifySellerReservation()</text>

<!-- Domain classes -->
<rect x="120" y="470" width="300" height="245" class="box"/><line x1="120" y1="515" x2="420" y2="515" class="line"/>
<text x="270" y="500" text-anchor="middle" class="head">Listing</text>
<text x="140" y="555" class="t">listingId</text><text x="140" y="585" class="t">sellerId</text><text x="140" y="615" class="t">status</text>
<text x="140" y="655" class="t">+ isReservableBy()</text><text x="140" y="685" class="t">+ reserve() / release()</text>

<rect x="500" y="455" width="360" height="290" class="box"/><line x1="500" y1="500" x2="860" y2="500" class="line"/>
<text x="680" y="485" text-anchor="middle" class="head">Order</text>
<text x="520" y="540" class="t">reference</text><text x="520" y="570" class="t">buyerId / listingId</text><text x="520" y="600" class="t">responseDeadline</text><text x="520" y="630" class="t">status</text>
<text x="520" y="670" class="t">+ accept() / reject() / cancel()</text><text x="520" y="700" class="t">+ expire() / markDelivered()</text><text x="520" y="730" class="t">+ confirmReceipt()</text>

<rect x="500" y="810" width="360" height="150" class="box"/><line x1="500" y1="855" x2="860" y2="855" class="line"/>
<text x="680" y="840" text-anchor="middle" class="head">OrderStatusChange</text>
<text x="520" y="895" class="t">fromStatus / toStatus</text><text x="520" y="925" class="t">changedAt / actorType</text>

<!-- Adapters -->
<rect x="1370" y="210" width="190" height="100" class="box"/><line x1="1370" y1="255" x2="1560" y2="255" class="line"/>
<text x="1465" y="242" text-anchor="middle" class="head">PersistenceAdapter</text><text x="1390" y="285" class="t">implements repos</text>

<rect x="1370" y="700" width="190" height="100" class="box"/><line x1="1370" y1="745" x2="1560" y2="745" class="line"/>
<text x="1465" y="732" text-anchor="middle" class="head">NotificationAdapter</text><text x="1390" y="775" class="t">implements port</text>

<!-- Dependencies: controller -> service -->
<path d="M380 195 H500" class="line"/>

<!-- Service to four interfaces: separate non-crossing orthogonal paths -->
<path d="M860 150 H930 V162 H1010" class="line"/>
<path d="M860 195 H945 V367 H1010" class="line"/>
<path d="M860 240 H960 V562 H1010" class="line"/>
<path d="M860 285 H975 V747 H1010" class="line"/>

<!-- Service to domain -->
<path d="M590 320 V390 H270 V470" class="line"/>
<path d="M680 320 V455" class="line"/>
<path d="M770 320 V390 H900 V885 H860" class="line"/>

<!-- Domain associations -->
<path d="M420 592 H500" class="line"/><text x="460" y="580" text-anchor="middle" class="t">reserves</text>
<path d="M680 745 V810" class="line"/><text x="700" y="785" class="t">records</text>

<!-- Realization lines from adapters -->
<path d="M1370 255 H1340 V162" class="dash"/>
<path d="M1340 162 V562" class="dash"/>
<path d="M1310 162 H1340" class="dash"/>
<path d="M1310 367 H1340" class="dash"/>
<path d="M1310 562 H1340" class="dash"/>
<path d="M1310 747 H1370" class="dash"/>
</svg>