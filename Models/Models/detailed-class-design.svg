<rect x="340" y="70" width="250" height="120" class="b"/><text x="465" y="105" text-anchor="middle" class="h">ReservationService</text><text x="355" y="140" class="t">+ reserve(...) : ReservationResult</text>
<rect x="700" y="50" width="220" height="100" class="b"/><text x="810" y="78" text-anchor="middle" class="t">&lt;&lt;interface&gt;&gt;</text><text x="810" y="105" text-anchor="middle" class="h">ListingRepository</text>
<rect x="950" y="50" width="220" height="100" class="b"/><text x="1060" y="78" text-anchor="middle" class="t">&lt;&lt;interface&gt;&gt;</text><text x="1060" y="105" text-anchor="middle" class="h">OrderRepository</text>
