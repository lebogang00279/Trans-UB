<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
  </marker>
</defs>
<style>
  text{font-family:Arial,sans-serif;fill:#000}
  .sys{fill:#86d3f7;stroke:#000;stroke-width:2}
  .comp{fill:#86d3f7;stroke:#000;stroke-width:2}
  .label{font-size:18px}
  .small{font-size:16px}
  .title{font-size:24px;font-weight:bold}
  .red{fill:#e53935;font-size:28px;font-weight:bold}
  .arrowred{stroke:#e53935;stroke-width:4;fill:none;marker-end:url(#arrowRed)}
  .line{stroke:#000;stroke-width:2;fill:none}
  .socket{stroke:#000;stroke-width:3;fill:none}
  .lolli{stroke:#000;stroke-width:3;fill:#86d3f7}
  .port{fill:#86d3f7;stroke:#000;stroke-width:2}
</style>
<defs>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#e53935"/>
  </marker>
</defs>

<!-- annotations -->
<text x="745" y="45" class="red">Component</text>
<line x1="790" y1="55" x2="790" y2="110" class="arrowred"/>
<text x="55" y="250" class="red">Provided</text>
<text x="5" y="290" class="red">Interface</text>
<line x1="115" y1="270" x2="165" y2="270" class="arrowred"/>
<text x="180" y="175" class="red">Port</text>
<line x1="230" y1="185" x2="265" y2="220" class="arrowred"/>
<text x="1470" y="260" class="red">Required Interface</text>
<line x1="1535" y1="275" x2="1535" y2="325" class="arrowred"/>

<!-- system boundary -->
<rect x="290" y="110" width="1170" height="720" class="sys"/>
<text x="820" y="150" text-anchor="middle" class="small">&lt;&lt;component&gt;&gt;</text>
<text x="820" y="188" text-anchor="middle" class="title">TRANS-UB Platform</text>

<!-- component icons -->
<!-- function -->
<!-- helper note: component icon drawn as 3 tabs -->
<g id="icon">
