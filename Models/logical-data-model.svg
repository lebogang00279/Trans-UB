<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950"><rect x="0" y="0" width="100%" height="100%" fill="#fff"/>
<style>
text{font-family:Arial,sans-serif;fill:#000}.box{fill:#fff;stroke:#000;stroke-width:2}.line{stroke:#000;stroke-width:2;fill:none}.title{font-size:28px;font-weight:bold}.head{font-size:18px;font-weight:bold}.t{font-size:15px}.card{font-size:14px}
</style>
<text x="750" y="45" text-anchor="middle" class="title">TRANS-UB Logical Data Model</text>

<!-- StudentAccount -->
<rect x="80" y="180" width="280" height="240" class="box"/><line x1="80" y1="225" x2="360" y2="225" class="line"/>
<text x="220" y="210" text-anchor="middle" class="head">StudentAccount</text>
<text x="100" y="260" class="t">PK student_id</text><text x="100" y="290" class="t">name</text><text x="100" y="320" class="t">eligible</text><text x="100" y="350" class="t">active</text>

<!-- Listing -->
<rect x="470" y="150" width="280" height="270" class="box"/><line x1="470" y1="195" x2="750" y2="195" class="line"/>
<text x="610" y="180" text-anchor="middle" class="head">Listing</text>
<text x="490" y="230" class="t">PK listing_id</text><text x="490" y="260" class="t">FK seller_id</text><text x="490" y="290" class="t">title</text><text x="490" y="320" class="t">status</text><text x="490" y="350" class="t">approved</text>

<!-- Order -->
<rect x="900" y="150" width="350" height="330" class="box"/><line x1="900" y1="195" x2="1250" y2="195" class="line"/>
<text x="1075" y="180" text-anchor="middle" class="head">Order</text>
<text x="920" y="230" class="t">PK order_reference</text><text x="920" y="260" class="t">FK listing_id</text><text x="920" y="290" class="t">FK buyer_id</text><text x="920" y="320" class="t">placed_at</text><text x="920" y="350" class="t">response_deadline</text><text x="920" y="380" class="t">status</text><text x="920" y="410" class="t">buyer_note</text>

<!-- Notification -->
<rect x="470" y="610" width="300" height="230" class="box"/><line x1="470" y1="655" x2="770" y2="655" class="line"/>
<text x="620" y="640" text-anchor="middle" class="head">Notification</text>
<text x="490" y="690" class="t">PK id</text><text x="490" y="720" class="t">FK order_reference</text><text x="490" y="750" class="t">recipient_id</text><text x="490" y="780" class="t">raised_at</text><text x="490" y="810" class="t">delivery_outcome</text>

<!-- Status history -->
<rect x="900" y="610" width="350" height="250" class="box"/><line x1="900" y1="655" x2="1250" y2="655" class="line"/>
<text x="1075" y="640" text-anchor="middle" class="head">OrderStatusChange</text>
<text x="920" y="690" class="t">PK id</text><text x="920" y="720" class="t">FK order_reference</text><text x="920" y="750" class="t">from_status</text><text x="920" y="780" class="t">to_status</text><text x="920" y="810" class="t">changed_at</text><text x="920" y="840" class="t">actor_type</text>

<!-- Relationships, orthogonal, no crossings -->
<path d="M360 250 H415 V250 H470" class="line"/><text x="385" y="238" class="card">1</text><text x="445" y="238" class="card">0..*</text><text x="415" y="275" text-anchor="middle" class="card">seller owns</text>

<path d="M750 250 H825 V250 H900" class="line"/><text x="775" y="238" class="card">1</text><text x="865" y="238" class="card">0..*</text><text x="825" y="275" text-anchor="middle" class="card">listing has orders</text>

<path d="M360 360 H410 V520 H1075 V480" class="line"/><text x="380" y="348" class="card">1</text><text x="1040" y="505" class="card">0..*</text><text x="700" y="545" text-anchor="middle" class="card">buyer places orders</text>

<path d="M1075 480 V610" class="line"/><text x="1088" y="545" class="card">1 : 1..*</text>

<path d="M900 430 H825 V725 H770" class="line"/><text x="820" y="575" class="card">1 : 0..*</text>

<text x="750" y="915" text-anchor="middle" class="card">Constraint: at most one live Order (Pending / Accepted / Delivered) per Listing.</text>
</svg>