<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1000" viewBox="0 0 1720 1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
  </marker>
</defs>
<style>
  text{font-family:Arial,sans-serif;fill:#000}
  .stereo{font-size:14px;fill:#333}
  .name{font-size:19px;font-weight:bold}
  .body{font-size:14px}
  .edge{font-size:14px;fill:#000}
  .zone{font-size:16px;font-weight:bold;fill:#1a5276}
  .flag{font-size:13px;font-weight:bold;fill:#8b1a1a}
  .client{fill:#ffffff;stroke:#000;stroke-width:2}
  .node{fill:#ffffff;stroke:#000;stroke-width:2}
  .proc{fill:#e8f4fb;stroke:#000;stroke-width:2}
  .store{fill:#e9f5ec;stroke:#000;stroke-width:2}
  .ext{fill:#fdf3e3;stroke:#000;stroke-width:2}
  .line{stroke:#000;stroke-width:2;fill:none}
  .bound{fill:none;stroke:#1a5276;stroke-width:2.5;stroke-dasharray:10 7}
</style>

<text x="30" y="40" class="name" style="font-size:24px">TRANS-UB Deployment View (DEP-01 v1)</text>
<text x="30" y="64" class="body">Proposed deployment for the Phase 1 baseline. Payment and physical handover are outside the system (D-001).</text>

<!-- client devices -->
<text x="30" y="128" class="zone">CLIENT DEVICES</text>

<rect x="30" y="150" width="250" height="110" class="client"/>
<text x="155" y="175" text-anchor="middle" class="stereo">&#171;device&#187;</text>
<text x="155" y="200" text-anchor="middle" class="name">Student buyer</text>
<text x="155" y="222" text-anchor="middle" class="body">Phone or lab PC</text>
<text x="155" y="243" text-anchor="middle" class="body">Browser</text>

<rect x="30" y="320" width="250" height="110" class="client"/>
<text x="155" y="345" text-anchor="middle" class="stereo">&#171;device&#187;</text>
<text x="155" y="370" text-anchor="middle" class="name">Student seller</text>
<text x="155" y="392" text-anchor="middle" class="body">Phone or lab PC</text>
<text x="155" y="413" text-anchor="middle" class="body">Browser</text>

<rect x="30" y="490" width="250" height="110" class="client"/>
<text x="155" y="515" text-anchor="middle" class="stereo">&#171;device&#187;</text>
<text x="155" y="540" text-anchor="middle" class="name">Platform administrator</text>
<text x="155" y="562" text-anchor="middle" class="body">Lab PC</text>
<text x="155" y="583" text-anchor="middle" class="body">Browser</text>

<!-- trust boundary -->
<rect x="330" y="88" width="980" height="852" class="bound"/>
<text x="346" y="112" class="zone">TRANS-UB TRUST BOUNDARY</text>

<!-- edge host -->
<rect x="358" y="268" width="212" height="176" class="node"/>
<text x="464" y="294" text-anchor="middle" class="stereo">&#171;node&#187;</text>
<text x="464" y="317" text-anchor="middle" class="name">Edge host</text>
<rect x="378" y="334" width="172" height="90" class="proc"/>
<text x="464" y="364" text-anchor="middle" class="name" style="font-size:17px">Reverse proxy</text>
<text x="464" y="388" text-anchor="middle" class="body">TLS termination</text>
<text x="464" y="408" text-anchor="middle" class="body">Static files</text>

<!-- application host -->
<rect x="630" y="140" width="620" height="420" class="node"/>
<text x="940" y="166" text-anchor="middle" class="stereo">&#171;node&#187;</text>
<text x="940" y="189" text-anchor="middle" class="name">Application host</text>

<rect x="656" y="206" width="568" height="132" class="proc"/>
<text x="940" y="229" text-anchor="middle" class="stereo">&#171;executionEnvironment&#187; web-1 &#183; &#171;artifact&#187; transub-app:1.0</text>
<text x="940" y="254" text-anchor="middle" class="name">Request process</text>
<text x="940" y="278" text-anchor="middle" class="body">Account / Authentication &#183; Listing Management</text>
<text x="940" y="298" text-anchor="middle" class="body">Order / Reservation &#183; Review &#183; Reporting / Moderation</text>
<text x="940" y="322" text-anchor="middle" class="flag">VOLATILE: session and in-request state only</text>

<rect x="656" y="356" width="568" height="140" class="proc"/>
<text x="940" y="379" text-anchor="middle" class="stereo">&#171;executionEnvironment&#187; worker-1 &#183; &#171;artifact&#187; transub-app:1.0</text>
<text x="940" y="404" text-anchor="middle" class="name">Background process</text>
<text x="940" y="428" text-anchor="middle" class="body">Notification delivery and retry</text>
<text x="940" y="448" text-anchor="middle" class="body">24-hour order expiry sweep (FR-07)</text>
<text x="940" y="474" text-anchor="middle" class="flag">RECOVERY OWNER for unfinished notification work</text>

<text x="870" y="532" text-anchor="middle" class="body">Separate processes, shared host. One host failure still stops both.</text>

<!-- database host -->
<rect x="630" y="600" width="620" height="290" class="node"/>
<text x="940" y="626" text-anchor="middle" class="stereo">&#171;node&#187;</text>
<text x="940" y="649" text-anchor="middle" class="name">Database host</text>

<rect x="656" y="666" width="568" height="200" class="store"/>
<text x="940" y="692" text-anchor="middle" class="name" style="font-size:17px">Transactional store</text>
<text x="940" y="718" text-anchor="middle" class="body">StudentAccount (synthetic prototype identity) &#183; Listing &#183; ListingApproval</text>
<text x="940" y="740" text-anchor="middle" class="body">Order &#183; OrderStatusChange &#183; Review &#183; Report</text>
<text x="940" y="762" text-anchor="middle" class="body">Notification (deliveryOutcome, attempts)</text>
<text x="940" y="792" text-anchor="middle" class="flag">DURABLE STATE &#183; survives a process restart</text>
<text x="940" y="820" text-anchor="middle" class="body">Constraint: at most one live reservation per Listing</text>
<text x="940" y="845" text-anchor="middle" class="body">Reservation writes Order + OrderStatusChange + Listing status in one commit</text>

<!-- external provider -->
<rect x="1380" y="520" width="310" height="184" class="ext"/>
<text x="1535" y="546" text-anchor="middle" class="stereo">&#171;node&#187; external system</text>
<text x="1535" y="571" text-anchor="middle" class="name">Notification provider</text>
<text x="1535" y="595" text-anchor="middle" class="body">Email / SMS</text>
<text x="1535" y="621" text-anchor="middle" class="body">Provider and API not yet selected</text>
<text x="1535" y="647" text-anchor="middle" class="flag">No delivery guarantee assumed</text>
<text x="1535" y="675" text-anchor="middle" class="body">A timeout does not prove</text>
<text x="1535" y="694" text-anchor="middle" class="body">non-delivery</text>

<!-- client to proxy -->
<line x1="280" y1="205" x2="376" y2="348" class="line" marker-end="url(#arrow)"/>
<text x="286" y="248" class="edge">HTTPS</text>

<line x1="280" y1="375" x2="376" y2="375" class="line" marker-end="url(#arrow)"/>
<text x="300" y="366" class="edge">HTTPS</text>

<line x1="280" y1="545" x2="376" y2="410" class="line" marker-end="url(#arrow)"/>
<text x="286" y="512" class="edge">HTTPS</text>

<!-- proxy to web-1 -->
<line x1="550" y1="356" x2="654" y2="272" class="line" marker-end="url(#arrow)"/>
<text x="492" y="236" class="edge">HTTP over loopback</text>
<text x="492" y="254" class="edge">same host only</text>

<!-- web-1 to database -->
<path d="M656,300 L600,300 L600,730 L654,730" class="line" marker-end="url(#arrow)"/>
<text x="592" y="544" text-anchor="end" class="edge">DB protocol: not yet selected</text>
<text x="592" y="562" text-anchor="end" class="edge">reservation committed atomically</text>

<!-- worker-1 to database -->
<line x1="1130" y1="496" x2="1130" y2="664" class="line" marker-end="url(#arrow)"/>
<text x="1114" y="582" text-anchor="end" class="edge">DB protocol: not yet selected &#183; worker claims pending work</text>

<!-- worker-1 to provider -->
<line x1="1224" y1="470" x2="1378" y2="580" class="line" marker-end="url(#arrow)"/>
<text x="1258" y="446" class="edge">HTTPS</text>
<text x="1258" y="464" class="edge">outside the reservation transaction</text>

<!-- legend -->
<rect x="30" y="700" width="560" height="190" class="node"/>
<text x="50" y="728" class="name" style="font-size:17px">Reading the model</text>
<rect x="50" y="744" width="26" height="18" class="proc"/>
<text x="88" y="759" class="body">Process running the deployed artefact</text>
<rect x="50" y="774" width="26" height="18" class="store"/>
<text x="88" y="789" class="body">Durable store. Everything else is lost on restart.</text>
<rect x="50" y="804" width="26" height="18" class="ext"/>
<text x="88" y="819" class="body">External system outside the trust boundary</text>
<line x1="50" y1="846" x2="76" y2="846" class="line"/>
<text x="88" y="851" class="body">Communication path, labelled with its protocol</text>
<text x="50" y="876" class="body">Solid path means exchange, not execution order.</text>
</svg>
